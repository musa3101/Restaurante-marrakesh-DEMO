<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Carta Tacos Marrakech - Español</title>
  <style>
    body {
      margin: 0;
      padding: 0;
      background-color: #0A0706;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
    }
    .container {
      width: 100%;
      max-width: 900px;
      padding: 16px;
      box-sizing: border-box;
      display: flex;
      flex-direction: column;
      gap: 24px;
    }
    img {
      width: 100%;
      height: auto;
      display: block;
      border-radius: 16px;
      box-shadow: 0 10px 30px rgba(0,0,0,0.5);
      border: 1px solid rgba(255,255,255,0.08);
      background-color: #ffffff;
    }
  </style>
</head>
<body>
  <div class="container">
    <img src="assets/menu_png/es/1.png" alt="Carta Tacos Marrakech - Página 1">
    <img src="assets/menu_png/es/Tacos y Pizza.png" alt="Carta Tacos Marrakech - Página 2">
    <img src="assets/menu_png/es/Kebab y Hamburguesas.png" alt="Carta Tacos Marrakech - Página 3">
  </div>
</body>
</html>
